# Build and publish one family of Munarium client packages from a tagged
# commit of its source repository.
#
# MANUAL TRIGGER ONLY. Nothing here runs on push, pull request, tag or
# schedule. A maintainer names a source repository, a package family and the
# family's release tag, and ticks the registries to publish to. Every registry
# switch defaults to OFF, so a dispatch with nothing ticked is a full
# rehearsal: it proves the source commit, runs the source's own gates, builds
# and tests every package, scans the built artifacts, reports which versions
# are already on the registries, and uploads the packages for inspection.
#
# The code lives in the source repositories (sources.json names them and the
# families each may publish); each describes its families in
# clients/release.json. This repository holds only the publishing mechanics
# and the credentials, so a package moving between source repositories never
# moves a trusted publisher or a secret.
#
# Before anything is built, preflight requires that the tag's commit is on the
# source's main branch, arrived through a merged pull request whose final head
# has no failing or unfinished check, has no failing check of its own, and is
# the release the tag names (the version declared in that tree). Source code
# runs only in jobs that hold no credential: preflight's gates and the build
# jobs. The NuGet, PyPI and Maven publish jobs push the artifacts the build
# jobs uploaded and run nothing from the source. crates.io cannot take a
# prebuilt package, so publish-crates runs `cargo publish` on the verified
# commit; that is the one exception, and the reason the crates.io token is
# requested in the step before the upload and revoked when the job ends.
#
# Already-published versions are SKIPPED, not failed, so a dispatch with every
# registry ticked publishes whatever is missing and touches nothing present.
# Maven Central is checked against the public repository, so a bundle that is
# validated but not yet published in the Portal (USER_MANAGED) is not seen as
# published and would be uploaded again; publish or drop the pending one first.
#
# Credentials, none of which this file contains. Every trusted publisher names
# repository iokaio/munarium-clients-publish, workflow publish.yml, and
# environment `release`:
#   NuGet      OIDC via NuGet/login; repository variable NUGET_USER holds the
#              NuGet.org profile that owns the trusted-publishing policy.
#   PyPI       OIDC via pypa/gh-action-pypi-publish, on pypi.org and
#              test.pypi.org, one trusted publisher per project.
#   crates.io  OIDC via rust-lang/crates-io-auth-action, one trusted publisher
#              per crate.
#   Maven      secrets CENTRAL_USERNAME + CENTRAL_PASSWORD (a Central Portal
#              user token) and GPG_PRIVATE_KEY + GPG_PASSPHRASE (the release
#              signing key, ASCII-armored). The Portal has no OIDC option.
#
# A real publish is refused unless this workflow runs from this repository's
# main; a rehearsal may run from any ref. Every publish job, TestPyPI
# included, runs in the `release` environment, which accepts main only and
# requires a reviewer. Tags are created in the source repository BEFORE the
# dispatch, by a maintainer; this repository never writes to a source.
name: publish

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source repository (must be listed in sources.json)
        type: choice
        required: true
        options:
          - iokaio/munarium-matrix
          - iokaio/munarium
      family:
        description: Package family (its source's clients/release.json defines it)
        type: choice
        required: true
        options:
          - matrix-clients
          - server-clients
          - server-crates
      tag:
        description: The family's release tag in the source, e.g. matrix-clients-v1.2.0
        type: string
        required: true
      publish_nuget:
        description: Publish .NET packages to NuGet.org
        type: boolean
        default: false
      publish_pypi:
        description: Publish Python packages (target chosen below)
        type: boolean
        default: false
      pypi_target:
        description: PyPI target. test.pypi.org is a rehearsal and never counts as a release.
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
      publish_maven:
        description: Upload Java bundles to the Sonatype Central Portal
        type: boolean
        default: false
      maven_publishing_type:
        description: USER_MANAGED validates and waits for a click in the Portal; AUTOMATIC releases on validation.
        type: choice
        default: USER_MANAGED
        options:
          - USER_MANAGED
          - AUTOMATIC
      publish_crates:
        description: Publish Rust crates to crates.io, in the order the family lists them
        type: boolean
        default: false

# One release at a time. A second dispatch queues behind the first rather
# than racing it for the same version.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # A run counts as a real publish when any registry other than TestPyPI is
  # selected. Rehearsals may run from any ref.
  REAL_PUBLISH: ${{ inputs.publish_nuget || inputs.publish_maven || inputs.publish_crates || (inputs.publish_pypi && inputs.pypi_target == 'pypi') }}

jobs:
  # ---------------------------------------------------------------------------
  # preflight: prove the source commit, plan the packages, run the source's
  # gates, and read the registry state. Nothing is built or published here.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: a real publish runs from main only
        if: env.REAL_PUBLISH == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::publishing is allowed from refs/heads/main only (this run is on ${GITHUB_REF}); untick every registry to rehearse from a branch"
          exit 1

      - name: the tag's commit is on main, merged through a green pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          branch="$(jq -r --arg s "$SOURCE" '.[$s].branch // empty' sources.json)"
          if [ -z "$branch" ]; then echo "::error::$SOURCE is not listed in sources.json"; exit 1; fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::tag '$TAG' is not a plain tag name"; exit 1
          fi
          if ! ref="$(gh api "repos/$SOURCE/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            echo "::error::$SOURCE has no tag $TAG; a maintainer creates it before dispatching"; exit 1
          fi
          read -r kind sha <<< "$ref"
          # An annotated tag points at a tag object; follow it to the commit.
          if [ "$kind" = tag ]; then sha="$(gh api "repos/$SOURCE/git/tags/$sha" --jq .object.sha)"; fi
          status="$(gh api "repos/$SOURCE/compare/$sha...$branch" --jq .status)"
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::$TAG ($sha) is not on $SOURCE $branch (compare status: $status)"; exit 1 ;;
          esac
          head="$(gh api "repos/$SOURCE/commits/$sha/pulls" \
                  --jq "[.[] | select(.merged_at != null and .base.ref == \"$branch\")][0].head.sha // empty")"
          if [ -z "$head" ]; then echo "::error::$sha did not arrive on $branch through a merged pull request"; exit 1; fi

          # Latest attempt of every check run; anything unfinished or not
          # success/skipped/neutral stops the release.
          unhealthy() {
            gh api "repos/$SOURCE/commits/$1/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.status != "completed" or ((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not)) | "\(.name): \(.status)/\(.conclusion)"'
          }
          count="$(gh api "repos/$SOURCE/commits/$head/check-runs?per_page=1" --jq .total_count)"
          if [ "$count" -eq 0 ]; then echo "::error::the pull request head $head has no check runs"; exit 1; fi
          bad="$(unhealthy "$head"; unhealthy "$sha")"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | sed 's/^/::error::check not green: /'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::$SOURCE $TAG is $sha on $branch, merged from pull request head $head ($count check runs, all green)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source }}
          ref: ${{ steps.source.outputs.sha }}
          path: src
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: package plan and registry state
        id: plan
        env:
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.source.outputs.sha }}
          PUBLISH_NUGET: ${{ inputs.publish_nuget }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          PYPI_TARGET: ${{ inputs.pypi_target }}
          PUBLISH_MAVEN: ${{ inputs.publish_maven }}
          PUBLISH_CRATES: ${{ inputs.publish_crates }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PUBLISH_NUGET" = true ] && flags+=(--publish-nuget)
          [ "$PUBLISH_PYPI" = true ] && flags+=(--publish-pypi)
          [ "$PUBLISH_MAVEN" = true ] && flags+=(--publish-maven)
          [ "$PUBLISH_CRATES" = true ] && flags+=(--publish-crates)
          python3 scripts/plan.py --source "$SOURCE" --family "$FAMILY" --tag "$TAG" --sha "$SHA" \
            --src src --pypi-target "$PYPI_TARGET" --summary "$GITHUB_STEP_SUMMARY" "${flags[@]}" >> "$GITHUB_OUTPUT"

      - name: the source's own release gates
        working-directory: src
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" | jq -r '.gates[]' > "$RUNNER_TEMP/gates"
          while IFS= read -r gate; do
            echo "::group::$gate"
            bash -euo pipefail -c "$gate"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/gates"

  # ---------------------------------------------------------------------------
  # build jobs: no credentials. Each checks out the verified commit, builds and
  # tests its packages, scans the artifacts with the source's own licence
  # checker, and uploads them for inspection and for the publish jobs.
  # ---------------------------------------------------------------------------
  build-dotnet:
    needs: preflight
    if: fromJSON(needs.preflight.outputs.plan).nuget[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.plan).nuget }}
    name: build-dotnet (${{ matrix.id }})
    env:
      ARTIFACT_CHECK: ${{ fromJSON(needs.preflight.outputs.plan).artifact_check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.preflight.outputs.plan).source }}
          ref: ${{ fromJSON(needs.preflight.outputs.plan).sha }}
          path: src
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: build and test
        working-directory: src/${{ matrix.dir }}
        run: |
          dotnet build
          dotnet test "${{ matrix.tests }}" --no-build -v q
      - name: pack
        working-directory: src/${{ matrix.dir }}
        run: dotnet pack "${{ matrix.project }}" -p:PackageOutputPath="$RUNNER_TEMP/nupkg/"
      - name: the package carries the license files and nothing outside itself, at the planned version
        run: |
          ls -l "$RUNNER_TEMP/nupkg"
          python3 "src/$ARTIFACT_CHECK" --artifact "$RUNNER_TEMP"/nupkg/*.nupkg
          ls "$RUNNER_TEMP"/nupkg/*."${{ matrix.version }}".nupkg > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ matrix.id }}
          path: ${{ runner.temp }}/nupkg/*.nupkg
          if-no-files-found: error

  build-python:
    needs: preflight
    if: fromJSON(needs.preflight.outputs.plan).pypi[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.plan).pypi }}
    name: build-python (${{ matrix.name }})
    env:
      ARTIFACT_CHECK: ${{ fromJSON(needs.preflight.outputs.plan).artifact_check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.preflight.outputs.plan).source }}
          ref: ${{ fromJSON(needs.preflight.outputs.plan).sha }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install and test
        working-directory: src/${{ matrix.dir }}
        run: |
          python -m pip install -U pip build
          pip install -e ".[dev]"
          python -m pytest tests -q
      - name: build sdist and wheel
        working-directory: src/${{ matrix.dir }}
        run: python -m build --sdist --wheel --outdir "$RUNNER_TEMP/pydist"
      - name: the distributions carry the license files and nothing outside themselves, at the planned version
        run: |
          ls -l "$RUNNER_TEMP/pydist"
          python "src/$ARTIFACT_CHECK" --artifact "$RUNNER_TEMP"/pydist/*
          ls "$RUNNER_TEMP"/pydist/*-"${{ matrix.version }}"-*.whl "$RUNNER_TEMP"/pydist/*-"${{ matrix.version }}".tar.gz > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pydist-${{ matrix.name }}
          path: ${{ runner.temp }}/pydist/*
          if-no-files-found: error

  build-java:
    needs: preflight
    if: fromJSON(needs.preflight.outputs.plan).maven[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.plan).maven }}
    name: build-java (${{ matrix.artifact }})
    env:
      ARTIFACT_CHECK: ${{ fromJSON(needs.preflight.outputs.plan).artifact_check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.preflight.outputs.plan).source }}
          ref: ${{ fromJSON(needs.preflight.outputs.plan).sha }}
          path: src
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: build, test, and stage the Maven publication
        # `publishToMavenLocal` lays out the POM, the main jar, and the
        # -sources and -javadoc jars Central requires under ~/.m2. Signing
        # happens in the publish job, never here.
        working-directory: src/${{ matrix.dir }}
        run: ./gradlew build publishToMavenLocal --no-daemon
      - name: the jars carry the license files and nothing outside themselves, at the planned version
        run: |
          staged="$HOME/.m2/repository/${{ matrix.group_path }}/${{ matrix.artifact }}/${{ matrix.version }}"
          ls -l "$staged"
          python3 "src/$ARTIFACT_CHECK" --artifact "$staged"/*.jar
          dest="$RUNNER_TEMP/maven/${{ matrix.group_path }}/${{ matrix.artifact }}/${{ matrix.version }}"
          mkdir -p "$dest"
          # Everything Gradle wrote for this version except the local
          # metadata index, which is not part of a Central bundle.
          find "$staged" -maxdepth 1 -type f ! -name 'maven-metadata-local.xml' -exec cp {} "$dest/" \;
          ls -l "$dest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-${{ matrix.artifact }}
          path: ${{ runner.temp }}/maven
          if-no-files-found: error

  build-rust:
    # One job, not a matrix: the crates are checked in the order the publish
    # job uses, and a later crate may depend on an earlier one.
    needs: preflight
    if: fromJSON(needs.preflight.outputs.plan).crates[0] != null
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ needs.preflight.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.preflight.outputs.plan).source }}
          ref: ${{ fromJSON(needs.preflight.outputs.plan).sha }}
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: stable
      - name: the family's copies (files a crate packages but the tree does not track)
        run: |
          printf '%s' "$PLAN" | jq -r '.copy[] | "\(.from)|\(.to)"' | while IFS='|' read -r from to; do
            if [ ! -e "src/$to" ]; then cp -r "src/$from" "src/$to"; echo "copied $from -> $to"; fi
          done

      - name: each crate packages with the license files and nothing outside itself, and passes its tests
        # `cargo package --list` is the exact file set crates.io would receive.
        run: |
          # `|` separates the fields: an empty middle field (no package flags)
          # would collapse under a whitespace separator. plan.py forbids `|`
          # in every path and flag.
          printf '%s' "$PLAN" | jq -r '.artifact_check as $c | .crates[] | "\(.dir)|\(.crate)|\(.package_flags)|\($c)"' \
          | while IFS='|' read -r dir crate flags check; do
            echo "::group::$crate ($dir)"
            ( cd "src/$dir"
              cargo package -p "$crate" --list $flags > "$RUNNER_TEMP/$crate.files"
              python3 "$GITHUB_WORKSPACE/src/$check" --rust-list "$RUNNER_TEMP/$crate.files"
              cargo test -p "$crate" )
            echo "::endgroup::"
          done

  # No registry is allowed to publish until every package type in this family
  # has built and tested. Without this barrier, NuGet could publish while the
  # Java build was failing, leaving a release partially published for a reason
  # known before publication began. Jobs for package types the family does not
  # contain are expected to be skipped.
  builds-passed:
    needs: [preflight, build-dotnet, build-python, build-java, build-rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every selected build passed
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DOTNET: ${{ needs.build-dotnet.result }}
          PYTHON: ${{ needs.build-python.result }}
          JAVA: ${{ needs.build-java.result }}
          RUST: ${{ needs.build-rust.result }}
        run: |
          set -euo pipefail
          [ "$PREFLIGHT" = success ]
          for result in "$DOTNET" "$PYTHON" "$JAVA" "$RUST"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::not every package build passed ($DOTNET, $PYTHON, $JAVA, $RUST)"; exit 1 ;;
            esac
          done

  # ---------------------------------------------------------------------------
  # publish jobs: each gated by its input switch AND the `release` environment,
  # and each running only for packages preflight found missing from the
  # registry. A job whose to-do list is empty is skipped outright.
  # ---------------------------------------------------------------------------
  publish-nuget:
    needs: [preflight, builds-passed]
    if: inputs.publish_nuget && fromJSON(needs.preflight.outputs.plan).nuget_todo[0] != null
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.plan).nuget_todo }}
    name: publish-nuget (${{ matrix.id }})
    steps:
      - name: NUGET_USER must be set
        if: vars.NUGET_USER == ''
        run: |
          echo "::error::repository variable NUGET_USER (the NuGet.org profile name that owns the trusted-publishing policy) is not set"
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-${{ matrix.id }}
          path: nupkg
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: exchange the OIDC token for a short-lived NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: push
        # No --skip-duplicate: preflight already proved the version is new,
        # so a duplicate here is a real error, not something to hide.
        run: |
          for f in nupkg/*.nupkg; do
            echo "pushing $f"
            dotnet nuget push "$f" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
            echo "- NuGet: \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  publish-pypi:
    needs: [preflight, builds-passed]
    if: inputs.publish_pypi && fromJSON(needs.preflight.outputs.plan).pypi_todo[0] != null
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.plan).pypi_todo }}
    name: publish-pypi (${{ matrix.name }})
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pydist-${{ matrix.name }}
          path: dist
      - name: publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.pypi_target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true
      - name: summary
        run: |
          echo "- ${{ inputs.pypi_target }}: $(ls dist | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  publish-maven:
    needs: [preflight, builds-passed]
    if: inputs.publish_maven && fromJSON(needs.preflight.outputs.plan).maven_todo[0] != null
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.plan).maven_todo }}
    name: publish-maven (${{ matrix.artifact }})
    steps:
      - name: the Central Portal credentials and signing key must be set
        env:
          HAVE: ${{ secrets.CENTRAL_USERNAME != '' && secrets.CENTRAL_PASSWORD != '' && secrets.GPG_PRIVATE_KEY != '' && secrets.GPG_PASSPHRASE != '' }}
        run: |
          if [ "$HAVE" != "true" ]; then
            echo "::error::secrets CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE must all be set"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-${{ matrix.artifact }}
          path: bundle
      - name: sign and checksum every file Central requires
        # Central wants, per artifact file: .asc (a detached armored PGP
        # signature), .md5 and .sha1. The key is imported into a throwaway
        # keyring on this runner and never written anywhere else.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          find bundle -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) | while read -r f; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done
          rm -rf "$GNUPGHOME"
          find bundle -type f | sort
      - name: upload the bundle to the Central Portal and wait for validation
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.maven_publishing_type }}
          GROUP: ${{ matrix.group }}
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ matrix.version }}
        run: |
          top="${GROUP%%.*}"
          (cd bundle && zip -qr ../bundle.zip "$top")
          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          id="$(curl --fail-with-body -sS -H "Authorization: Bearer $auth" \
                -F "bundle=@bundle.zip" \
                "https://central.sonatype.com/api/v1/publisher/upload?name=$GROUP%3A$ARTIFACT%3A$VERSION&publishingType=$PUBLISHING_TYPE")"
          echo "deployment $id"
          for i in $(seq 1 60); do
            sleep 10
            body="$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id")"
            state="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState",""))')"
            echo "state: $state"
            case "$state" in
              FAILED) printf '%s\n' "$body"; echo "::error::Central rejected the bundle"; exit 1 ;;
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
            esac
          done
          case "$state" in
            VALIDATED) echo "- Maven Central: $GROUP:$ARTIFACT:$VERSION validated; deployment $id is waiting for Publish in the Portal" >> "$GITHUB_STEP_SUMMARY" ;;
            PUBLISHING|PUBLISHED) echo "- Maven Central: $GROUP:$ARTIFACT:$VERSION $state (deployment $id)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::deployment $id did not validate within 10 minutes (last state: $state)"; exit 1 ;;
          esac

  publish-crates:
    # One job, not a matrix: the crates publish in the order the family lists
    # them, and cargo publish blocks until each is visible in the index so the
    # next can resolve it. Already-published crates are not in the to-do list.
    needs: [preflight, builds-passed]
    if: inputs.publish_crates && fromJSON(needs.preflight.outputs.plan).crates_todo[0] != null
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ needs.preflight.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(needs.preflight.outputs.plan).source }}
          ref: ${{ fromJSON(needs.preflight.outputs.plan).sha }}
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: stable
      - name: the family's copies
        run: |
          printf '%s' "$PLAN" | jq -r '.copy[] | "\(.from)|\(.to)"' | while IFS='|' read -r from to; do
            if [ ! -e "src/$to" ]; then cp -r "src/$from" "src/$to"; fi
          done
      - name: exchange the OIDC token for a short-lived crates.io token
        # Scoped to the crates whose trusted publisher names this repository,
        # workflow and environment, and revoked by the action when the job
        # ends. A crate without a matching publisher fails here.
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish, in order
        # The credentialless build-rust job already tested each crate and
        # inspected its package file list. `--no-verify` prevents Cargo from
        # rebuilding source (and running build.rs) while this short-lived
        # publishing credential is present; invoking Cargo from this trusted
        # repository root also keeps source-owned .cargo/config files out of
        # configuration discovery. Cargo still packages and uploads the source
        # from the verified commit, then waits for it in the index.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          printf '%s' "$PLAN" | jq -r '.crates_todo[] | "\(.dir)|\(.crate)|\(.package_flags)"' \
          | while IFS='|' read -r dir crate flags; do
            echo "publishing $crate from $dir"
            cargo publish --no-verify --manifest-path "src/$dir/Cargo.toml" -p "$crate" $flags
            echo "- crates.io: \`$crate\`" >> "$GITHUB_STEP_SUMMARY"
          done
