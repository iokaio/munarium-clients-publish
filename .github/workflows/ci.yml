# The planner's own tests, on every push and pull request. publish.yml is
# dispatched by hand and never runs here.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    name: planner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: sources.json parses
        run: python3 -c "import json; json.load(open('sources.json', encoding='utf-8'))"
